<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 22!</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #080818;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ---- Stars background ---- */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(0.8); }
    to   { opacity: 1;   transform: scale(1.2); }
  }

  /* ---- Confetti ---- */
  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .confetti {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 14px;
    border-radius: 2px;
    animation: fall var(--dur) linear var(--delay) infinite;
    opacity: 0;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg);    opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
  }

  /* ---- Card ---- */
  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 55px 65px 50px;
    border-radius: 30px;
    background: linear-gradient(145deg, #12123a 0%, #1e1060 60%, #2a0a40 100%);
    border: 1.5px solid rgba(255,255,255,0.12);
    box-shadow:
      0 0 60px rgba(140,60,255,0.35),
      0 0 120px rgba(255,80,160,0.15),
      inset 0 1px 0 rgba(255,255,255,0.08);
    animation: cardPop 0.9s cubic-bezier(0.34,1.56,0.64,1) both;
    max-width: 92vw;
  }
  @keyframes cardPop {
    from { transform: scale(0.4) rotate(-6deg); opacity: 0; }
    to   { transform: scale(1)   rotate(0deg);  opacity: 1; }
  }

  /* glowing ring */
  .card::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 33px;
    background: conic-gradient(from 0deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #cc5de8, #ff6b6b);
    z-index: -1;
    animation: spin 4s linear infinite;
    opacity: 0.5;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cake {
    font-size: 80px;
    display: block;
    animation: bounce 1.2s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 20px rgba(255,200,100,0.7));
  }
  @keyframes bounce {
    from { transform: translateY(0)   rotate(-6deg) scale(1); }
    to   { transform: translateY(-14px) rotate(6deg)  scale(1.08); }
  }

  .hb {
    font-family: 'Pacifico', cursive;
    font-size: clamp(36px, 8vw, 58px);
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #cc5de8, #ff6b6b);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
    line-height: 1.25;
    margin-top: 6px;
  }
  @keyframes shimmer {
    0%   { background-position: 0% }
    100% { background-position: 300% }
  }

  .age-wrap {
    position: relative;
    display: inline-block;
    margin: 8px 0 4px;
  }
  .age {
    font-family: 'Pacifico', cursive;
    font-size: clamp(80px, 20vw, 120px);
    color: #ffd93d;
    text-shadow:
      0 0 20px rgba(255,217,61,0.8),
      0 0 50px rgba(255,217,61,0.4),
      0 0 100px rgba(255,150,50,0.3);
    animation: glow 1.8s ease-in-out infinite;
    line-height: 1;
  }
  @keyframes glow {
    0%,100% { text-shadow: 0 0 20px rgba(255,217,61,0.8), 0 0 50px rgba(255,217,61,0.4); }
    50%      { text-shadow: 0 0 40px rgba(255,217,61,1),   0 0 100px rgba(255,200,80,0.7); }
  }

  .tuoi {
    font-family: 'Pacifico', cursive;
    font-size: clamp(22px, 5vw, 32px);
    color: rgba(255,255,255,0.85);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .subtitle {
    color: rgba(255,255,255,0.6);
    font-size: clamp(13px, 3vw, 16px);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .sparkles {
    font-size: 28px;
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .sparkles span {
    display: inline-block;
    animation: spinStar 2.5s linear infinite;
  }
  .sparkles span:nth-child(2) { animation-delay: 0.4s; animation-duration: 3s; }
  .sparkles span:nth-child(3) { animation-delay: 0.8s; animation-duration: 2s; }
  @keyframes spinStar {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.3); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* balloons */
  .balloons {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .balloon {
    position: absolute;
    bottom: -120px;
    font-size: 48px;
    animation: floatUp var(--dur) ease-in var(--delay) infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-8deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.7; }
    100% { transform: translateY(-110vh) rotate(8deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Confetti -->
<div class="confetti-wrap" id="confetti"></div>

<!-- Balloons -->
<div class="balloons" id="balloons"></div>

<!-- Main card -->
<div class="card">
  <span class="cake">🎂</span>
  <div class="hb">Happy Birthday!</div>
  <div class="age-wrap">
    <div class="age">22</div>
  </div>
  <div class="tuoi">Tuổi 🎈</div>
  <div class="subtitle">🎉 Chúc mừng sinh nhật 🎉</div>
  <div class="sparkles">
    <span>✨</span><span>🌟</span><span>✨</span>
  </div>
</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      --d:${(Math.random()*3+1).toFixed(1)}s;
      animation-delay:${(Math.random()*3).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  // Confetti
  const confettiEl = document.getElementById('confetti');
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#cc5de8','#ff922b','#f06595','#74c0fc'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${Math.random()*8+6}px;
      height:${Math.random()*10+8}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
      --dur:${(Math.random()*4+3).toFixed(1)}s;
      --delay:${(Math.random()*5).toFixed(1)}s;
    `;
    confettiEl.appendChild(c);
  }

  // Balloons
  const balloonEl = document.getElementById('balloons');
  const emojis = ['🎈','🎀','🎁','🎊','🎉'];
  for (let i = 0; i < 10; i++) {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    b.style.cssText = `
      left:${Math.random()*95}%;
      --dur:${(Math.random()*5+6).toFixed(1)}s;
      --delay:${(Math.random()*8).toFixed(1)}s;
      font-size:${Math.random()*24+36}px;
    `;
    balloonEl.appendChild(b);
  }
</script>
</body>
</html>
