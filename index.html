<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #ffd93d;
    --pink: #ff6b9d;
    --purple: #a855f7;
    --bg: #0a0a1a;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
  }

  /* ===== STARS ===== */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; }
    to   { opacity: 0.9; }
  }

  /* ===== SCENE ===== */
  .scene {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .hint {
    color: rgba(255,255,255,0.5);
    font-size: 15px;
    letter-spacing: 2px;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }

  /* ===== GIFT BOX ===== */
  .gift-wrap {
    cursor: pointer;
    position: relative;
    width: 180px;
    height: 180px;
    filter: drop-shadow(0 0 30px rgba(255,107,157,0.5));
    transition: transform 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .gift-wrap:hover { transform: scale(1.05); }
  .gift-wrap:active { transform: scale(0.97); }

  .gift-wrap.shaking {
    animation: shake 0.5s ease-in-out;
  }
  @keyframes shake {
    0%,100% { transform: rotate(0deg); }
    20%     { transform: rotate(-8deg) scale(1.05); }
    40%     { transform: rotate(8deg)  scale(1.05); }
    60%     { transform: rotate(-5deg) scale(1.05); }
    80%     { transform: rotate(5deg)  scale(1.05); }
  }

  /* Box body */
  .box-body {
    position: absolute;
    bottom: 0;
    left: 10px;
    right: 10px;
    height: 100px;
    background: linear-gradient(135deg, #e91e8c, #9c27b0);
    border-radius: 8px 8px 12px 12px;
    box-shadow: inset 0 -4px 10px rgba(0,0,0,0.3);
  }
  .box-body::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 20px;
    transform: translateX(-50%);
    background: var(--gold);
    opacity: 0.9;
  }

  /* Box lid */
  .box-lid {
    position: absolute;
    top: 28px;
    left: 0; right: 0;
    height: 52px;
    background: linear-gradient(135deg, #f06292, #ce93d8);
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s;
    transform-origin: center top;
  }
  .box-lid::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 20px;
    transform: translateX(-50%);
    background: var(--gold);
    opacity: 0.9;
  }

  /* Ribbon bow */
  .bow {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 34px;
    z-index: 2;
    transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s;
    transform-origin: center bottom;
  }
  .bow-left, .bow-right {
    position: absolute;
    width: 30px;
    height: 28px;
    border-radius: 50% 0 50% 0;
    background: var(--gold);
    top: 0;
  }
  .bow-left  { left: 0;  transform: rotate(-30deg); }
  .bow-right { right: 0; transform: rotate(30deg) scaleX(-1); }
  .bow-center {
    position: absolute;
    width: 14px; height: 14px;
    background: #ffec6e;
    border-radius: 50%;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
  }

  /* Open state */
  .gift-wrap.opened .box-lid {
    transform: translateY(-80px) rotate(-20deg);
    opacity: 0;
  }
  .gift-wrap.opened .bow {
    transform: translateX(-50%) translateY(-80px) rotate(-20deg);
    opacity: 0;
  }

  /* ===== CONFETTI burst ===== */
  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  .conf {
    position: absolute;
    width: 10px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
  }
  .conf.burst {
    animation: confBurst var(--dur) ease-out var(--delay) forwards;
  }
  @keyframes confBurst {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
  }

  /* ===== BIRTHDAY CARD ===== */
  .birthday-card {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .birthday-card.show {
    opacity: 1;
    pointer-events: all;
  }

  .card-inner {
    text-align: center;
    padding: 50px 60px;
    border-radius: 28px;
    background: linear-gradient(145deg, #12123a, #1e1060, #2a0a40);
    border: 1.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 0 80px rgba(140,60,255,0.4), 0 0 160px rgba(255,80,160,0.15);
    max-width: 92vw;
    transform: scale(0.5);
    transition: transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
  }
  .birthday-card.show .card-inner {
    transform: scale(1);
  }

  /* rainbow border */
  .card-inner::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 31px;
    background: conic-gradient(from 0deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #cc5de8, #ff6b6b);
    z-index: -1;
    animation: spin 4s linear infinite;
    opacity: 0.55;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cake {
    font-size: 72px;
    display: block;
    animation: bounce 1.2s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 18px rgba(255,200,100,0.7));
  }
  @keyframes bounce {
    from { transform: translateY(0) rotate(-6deg); }
    to   { transform: translateY(-14px) rotate(6deg); }
  }

  .hb {
    font-family: 'Pacifico', cursive;
    font-size: clamp(34px, 8vw, 54px);
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #cc5de8, #ff6b6b);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
    line-height: 1.25;
    margin-top: 8px;
  }
  @keyframes shimmer {
    0%   { background-position: 0% }
    100% { background-position: 300% }
  }

  .age {
    font-family: 'Pacifico', cursive;
    font-size: clamp(80px, 20vw, 120px);
    color: var(--gold);
    text-shadow: 0 0 30px rgba(255,217,61,0.9), 0 0 70px rgba(255,200,50,0.4);
    animation: glow 1.8s ease-in-out infinite;
    line-height: 1;
    margin: 4px 0;
  }
  @keyframes glow {
    0%,100% { text-shadow: 0 0 30px rgba(255,217,61,0.9), 0 0 60px rgba(255,200,50,0.4); }
    50%      { text-shadow: 0 0 50px rgba(255,217,61,1),   0 0 100px rgba(255,200,80,0.7); }
  }

  .sub {
    color: rgba(255,255,255,0.65);
    font-size: clamp(13px, 3vw, 16px);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .sparks {
    font-size: 26px;
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .sparks span {
    display: inline-block;
    animation: spinStar 2.5s linear infinite;
  }
  .sparks span:nth-child(2) { animation-delay:.4s; animation-duration:3s; }
  .sparks span:nth-child(3) { animation-delay:.8s; }
  @keyframes spinStar {
    0%   { transform: rotate(0)   scale(1); }
    50%  { transform: rotate(180deg) scale(1.3); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* balloons */
  .balloons { position: fixed; inset: 0; pointer-events: none; z-index: 25; }
  .balloon {
    position: absolute;
    bottom: -120px;
    font-size: 44px;
    opacity: 0;
    animation: floatUp var(--dur) ease-in var(--delay) infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-8deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-110vh) rotate(8deg); opacity: 0; }
  }

  /* floating particles from box */
  .particle {
    position: absolute;
    font-size: 28px;
    opacity: 0;
    pointer-events: none;
  }
  .particle.fly {
    animation: flyOut 1.2s ease-out forwards;
  }
  @keyframes flyOut {
    0%   { transform: translate(0,0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="confetti-container" id="confetti"></div>
<div class="balloons" id="balloons"></div>

<!-- Gift scene -->
<div class="scene" id="scene">
  <div class="hint">Bấm vào hộp quà 🎁</div>

  <div class="gift-wrap" id="gift" onclick="openGift()">
    <!-- Bow -->
    <div class="bow">
      <div class="bow-left"></div>
      <div class="bow-right"></div>
      <div class="bow-center"></div>
    </div>
    <!-- Lid -->
    <div class="box-lid"></div>
    <!-- Body -->
    <div class="box-body"></div>

    <!-- floating emoji particles -->
    <div class="particle" id="p1" style="left:50%;top:20%">🌟</div>
    <div class="particle" id="p2" style="left:50%;top:20%">🎉</div>
    <div class="particle" id="p3" style="left:50%;top:20%">✨</div>
    <div class="particle" id="p4" style="left:50%;top:20%">🎊</div>
    <div class="particle" id="p5" style="left:50%;top:20%">💖</div>
  </div>
</div>

<!-- Birthday card (hidden initially) -->
<div class="birthday-card" id="card">
  <div class="card-inner">
    <span class="cake">🎂</span>
    <div class="hb">Happy Birthday!</div>
    <div class="age">22</div>
    <div class="sub">🎉 Chúc mừng sinh nhật 🎉</div>
    <div class="sparks">
      <span>✨</span><span>🌟</span><span>✨</span>
    </div>
  </div>
</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 100; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 3 + 1;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+1).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s`;
    starsEl.appendChild(s);
  }

  let opened = false;

  function openGift() {
    if (opened) return;

    const gift = document.getElementById('gift');

    // Shake first
    gift.classList.add('shaking');
    setTimeout(() => {
      gift.classList.remove('shaking');
      gift.classList.add('opened');

      // Fly particles
      const dirs = [
        {tx:'-120px', ty:'-150px'},
        {tx:'120px',  ty:'-150px'},
        {tx:'-80px',  ty:'-180px'},
        {tx:'80px',   ty:'-180px'},
        {tx:'0px',    ty:'-200px'},
      ];
      for (let i = 1; i <= 5; i++) {
        const p = document.getElementById('p'+i);
        const d = dirs[i-1];
        p.style.setProperty('--tx', d.tx);
        p.style.setProperty('--ty', d.ty);
        p.classList.add('fly');
      }

      // Confetti burst
      spawnConfetti();

      // Show card after delay
      setTimeout(() => {
        document.getElementById('scene').style.opacity = '0';
        document.getElementById('scene').style.transition = 'opacity 0.5s';
        setTimeout(() => {
          document.getElementById('scene').style.display = 'none';
          document.getElementById('card').classList.add('show');
          spawnBalloons();
        }, 500);
      }, 900);

    }, 500);

    opened = true;
  }

  function spawnConfetti() {
    const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#cc5de8','#ff922b','#f06595','#74c0fc'];
    const container = document.getElementById('confetti');
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.className = 'conf';
      const angle = Math.random() * Math.PI * 2;
      const dist  = Math.random() * 350 + 80;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      c.style.cssText = `
        left:${cx}px; top:${cy}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        width:${Math.random()*8+5}px;
        height:${Math.random()*10+7}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        --tx:${tx}px; --ty:${ty}px;
        --rot:${Math.random()*720-360}deg;
        --dur:${(Math.random()*0.6+0.6).toFixed(2)}s;
        --delay:${(Math.random()*0.3).toFixed(2)}s;
      `;
      c.classList.add('burst');
      container.appendChild(c);
    }
    setTimeout(() => container.innerHTML = '', 2000);
  }

  function spawnBalloons() {
    const el = document.getElementById('balloons');
    const emojis = ['🎈','🎀','🎁','🎊','🎉','💖','⭐'];
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      b.style.cssText = `left:${Math.random()*95}%;--dur:${(Math.random()*5+6).toFixed(1)}s;--delay:${(Math.random()*6).toFixed(1)}s;font-size:${Math.random()*20+34}px`;
      el.appendChild(b);
    }
  }
</script>
</body>
</html>
