<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #080818;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
  }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; } to { opacity: 0.9; }
  }

  /* ===== GIFT SCENE ===== */
  .scene {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; gap: 28px;
    transition: opacity 0.6s;
  }

  .hint {
    color: rgba(255,255,255,0.6);
    font-size: 16px; letter-spacing: 2px;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 0.3; } 50% { opacity: 1; }
  }

  /* ===== BOX ===== */
  .gift-wrap {
    cursor: pointer;
    position: relative;
    width: 200px; height: 200px;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 0 30px rgba(255,107,157,0.55));
    transition: transform 0.15s;
  }
  .gift-wrap:hover { transform: scale(1.04); }
  .gift-wrap:active { transform: scale(0.97); }

  /* body */
  .box-body {
    position: absolute;
    bottom: 0; left: 14px; right: 14px;
    height: 110px;
    background: linear-gradient(135deg, #d81b60, #8e24aa);
    border-radius: 8px 8px 14px 14px;
    box-shadow: inset 0 -6px 14px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .box-body::after {
    content: '';
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 22px; transform: translateX(-50%);
    background: #ffd93d; opacity: 0.9;
  }
  /* shine */
  .box-body::before {
    content: '';
    position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: rgba(255,255,255,0.12);
    transform: skewX(-20deg);
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine {
    0%,100% { left:-60%; } 50% { left:120%; }
  }

  /* lid */
  .box-lid {
    position: absolute;
    top: 55px; left: 0; right: 0;
    height: 56px;
    background: linear-gradient(135deg, #f06292, #ce93d8);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    transition: transform 0.7s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s;
    transform-origin: center top;
  }
  .box-lid::after {
    content: '';
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 22px; transform: translateX(-50%);
    background: #ffd93d; opacity: 0.9;
  }

  /* bow */
  .bow {
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 40px; z-index: 2;
    transition: transform 0.7s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s;
    transform-origin: center bottom;
  }
  .bow-left, .bow-right {
    position: absolute; width: 34px; height: 32px;
    border-radius: 50% 0 50% 0;
    background: #ffd93d; top: 0;
  }
  .bow-left  { left:0;  transform: rotate(-30deg); }
  .bow-right { right:0; transform: rotate(30deg) scaleX(-1); }
  .bow-center {
    position: absolute; width: 16px; height: 16px;
    background: #ffec6e; border-radius: 50%;
    left:50%; top:50%; transform: translate(-50%,-50%); z-index:3;
  }

  /* open state */
  .gift-wrap.shaking { animation: shake 0.55s ease-in-out; }
  @keyframes shake {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-10deg) scale(1.06); }
    40% { transform: rotate(10deg)  scale(1.06); }
    60% { transform: rotate(-6deg)  scale(1.06); }
    80% { transform: rotate(6deg)   scale(1.06); }
  }
  .gift-wrap.opened .box-lid { transform: translateY(-90px) rotate(-25deg); opacity: 0; }
  .gift-wrap.opened .bow     { transform: translateX(-50%) translateY(-90px) rotate(-25deg); opacity: 0; }

  /* particles */
  .particle {
    position: absolute; font-size: 26px;
    left: 50%; top: 30%; opacity: 0; pointer-events: none;
  }
  .particle.fly { animation: flyOut 1.1s ease-out forwards; }
  @keyframes flyOut {
    0%   { transform: translate(-50%,0) scale(0.5); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), var(--ty)) scale(1.3); opacity: 0; }
  }

  /* ===== CONFETTI ===== */
  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  .conf { position: absolute; opacity: 0; }
  .conf.burst { animation: confBurst var(--dur) ease-out var(--delay) forwards; }
  @keyframes confBurst {
    0%   { transform: translate(0,0) rotate(0); opacity:1; }
    100% { transform: translate(var(--tx),var(--ty)) rotate(var(--rot)); opacity:0; }
  }

  /* ===== BIRTHDAY CARD ===== */
  .birthday-card {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 30; opacity: 0; pointer-events: none;
    transition: opacity 0.8s;
    padding: 16px;
  }
  .birthday-card.show { opacity: 1; pointer-events: all; }

  .card-inner {
    text-align: center;
    padding: 48px 52px 44px;
    border-radius: 28px;
    background: linear-gradient(145deg, #12123a, #1e1060, #2a0a40);
    border: 1.5px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 80px rgba(140,60,255,0.4), 0 0 160px rgba(255,80,160,0.15);
    max-width: 92vw;
    position: relative;
    transform: scale(0.4);
    transition: transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
  }
  .birthday-card.show .card-inner { transform: scale(1); }

  .card-inner::before {
    content: '';
    position: absolute; inset: -3px; border-radius: 31px;
    background: conic-gradient(from 0deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#cc5de8,#ff6b6b);
    z-index: -1;
    animation: spin 4s linear infinite; opacity: 0.5;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cake {
    font-size: 70px; display: block;
    animation: bounce 1.2s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 18px rgba(255,200,100,0.7));
  }
  @keyframes bounce {
    from { transform: translateY(0) rotate(-6deg); }
    to   { transform: translateY(-14px) rotate(6deg); }
  }

  .hb {
    font-family: 'Pacifico', cursive;
    font-size: clamp(30px, 7vw, 50px);
    background: linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#cc5de8,#ff6b6b);
    background-size: 300%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
    line-height: 1.25; margin-top: 8px;
  }
  @keyframes shimmer { 0%{background-position:0%} 100%{background-position:300%} }

  .age {
    font-family: 'Pacifico', cursive;
    font-size: clamp(70px, 18vw, 110px);
    color: #ffd93d;
    text-shadow: 0 0 30px rgba(255,217,61,0.9), 0 0 70px rgba(255,200,50,0.4);
    animation: glow 1.8s ease-in-out infinite;
    line-height: 1; margin: 4px 0;
  }
  @keyframes glow {
    0%,100% { text-shadow: 0 0 30px rgba(255,217,61,0.9),0 0 60px rgba(255,200,50,0.4); }
    50%      { text-shadow: 0 0 50px rgba(255,217,61,1),  0 0 100px rgba(255,200,80,0.7); }
  }

  .love-msg {
    font-family: 'Pacifico', cursive;
    font-size: clamp(16px, 4vw, 24px);
    color: #ff6b9d;
    text-shadow: 0 0 14px rgba(255,107,157,0.6);
    margin-top: 6px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  .name {
    font-family: 'Pacifico', cursive;
    font-size: clamp(20px, 5vw, 32px);
    background: linear-gradient(90deg, #ff6b9d, #ffd93d, #ff6b9d);
    background-size: 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 2.5s linear infinite;
    margin-top: 4px;
  }

  .sub {
    color: rgba(255,255,255,0.55);
    font-size: clamp(12px, 2.5vw, 14px);
    letter-spacing: 3px; text-transform: uppercase; margin-top: 10px;
  }

  .sparks {
    font-size: 24px; margin-top: 14px;
    display: flex; justify-content: center; gap: 14px;
  }
  .sparks span { display: inline-block; animation: spinStar 2.5s linear infinite; }
  .sparks span:nth-child(2) { animation-delay:.4s; animation-duration:3s; }
  .sparks span:nth-child(3) { animation-delay:.8s; }
  @keyframes spinStar {
    0%   { transform: rotate(0) scale(1); }
    50%  { transform: rotate(180deg) scale(1.3); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* balloons */
  .balloons { position: fixed; inset: 0; pointer-events: none; z-index: 25; }
  .balloon {
    position: absolute; bottom: -120px; opacity: 0;
    animation: floatUp var(--dur) ease-in var(--delay) infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-8deg); opacity:0; }
    10%  { opacity:1; }
    90%  { opacity:0.6; }
    100% { transform: translateY(-110vh) rotate(8deg); opacity:0; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="confetti-container" id="confetti"></div>
<div class="balloons" id="balloons"></div>

<!-- Gift scene -->
<div class="scene" id="scene">
  <div class="hint">💝 Bấm vào hộp quà để mở 💝</div>

  <div class="gift-wrap" id="gift" onclick="openGift()">
    <div class="bow">
      <div class="bow-left"></div>
      <div class="bow-right"></div>
      <div class="bow-center"></div>
    </div>
    <div class="box-lid"></div>
    <div class="box-body"></div>

    <div class="particle" id="p1">💖</div>
    <div class="particle" id="p2">🌟</div>
    <div class="particle" id="p3">🎉</div>
    <div class="particle" id="p4">✨</div>
    <div class="particle" id="p5">🎊</div>
    <div class="particle" id="p6">💝</div>
  </div>
</div>

<!-- Birthday card -->
<div class="birthday-card" id="card">
  <div class="card-inner">
    <span class="cake">🎂</span>
    <div class="hb">Happy Birthday!</div>
    <div class="age">22</div>
    <div class="love-msg">C iuu 💖</div>
    <div class="name">Nguyễn Mỹ Hoa</div>
    <div class="sub">🎉 Chúc mừng sinh nhật 🎉</div>
    <div class="sparks">
      <span>✨</span><span>🌟</span><span>✨</span>
    </div>
  </div>
</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 110; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 3 + 1;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+1).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s`;
    starsEl.appendChild(s);
  }

  let opened = false;

  function openGift() {
    if (opened) return;
    opened = true;

    const gift = document.getElementById('gift');
    gift.classList.add('shaking');

    setTimeout(() => {
      gift.classList.remove('shaking');
      gift.classList.add('opened');

      // particles
      const dirs = [
        {tx:'-130px',ty:'-160px'},{tx:'130px',ty:'-160px'},
        {tx:'-70px', ty:'-200px'},{tx:'70px', ty:'-200px'},
        {tx:'0px',   ty:'-220px'},{tx:'160px',ty:'-100px'},
      ];
      for (let i = 1; i <= 6; i++) {
        const p = document.getElementById('p'+i);
        const d = dirs[i-1];
        p.style.setProperty('--tx', d.tx);
        p.style.setProperty('--ty', d.ty);
        p.classList.add('fly');
      }

      spawnConfetti();

      setTimeout(() => {
        const scene = document.getElementById('scene');
        scene.style.transition = 'opacity 0.5s';
        scene.style.opacity = '0';
        setTimeout(() => {
          scene.style.display = 'none';
          document.getElementById('card').classList.add('show');
          spawnBalloons();
        }, 500);
      }, 900);
    }, 550);
  }

  function spawnConfetti() {
    const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#cc5de8','#ff922b','#f06595','#ff6b9d'];
    const container = document.getElementById('confetti');
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'conf';
      const angle = Math.random() * Math.PI * 2;
      const dist  = Math.random() * 380 + 80;
      c.style.cssText = `
        left:${cx}px;top:${cy}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        width:${Math.random()*8+5}px;height:${Math.random()*10+7}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        --tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;
        --rot:${Math.random()*720-360}deg;
        --dur:${(Math.random()*0.6+0.7).toFixed(2)}s;
        --delay:${(Math.random()*0.3).toFixed(2)}s;
      `;
      c.classList.add('burst');
      container.appendChild(c);
    }
    setTimeout(() => container.innerHTML = '', 2500);
  }

  function spawnBalloons() {
    const el = document.getElementById('balloons');
    const emojis = ['🎈','🎀','💖','🎊','🎉','⭐','💝','🌸'];
    for (let i = 0; i < 14; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      b.style.cssText = `left:${Math.random()*95}%;--dur:${(Math.random()*5+6).toFixed(1)}s;--delay:${(Math.random()*7).toFixed(1)}s;font-size:${Math.random()*18+32}px`;
      el.appendChild(b);
    }
  }
</script>
</body>
</html>
